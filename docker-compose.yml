# docker-compose.yml — FLUVIAL
# Compatible Docker Compose v2 (plugin intégré à Docker CLI)
# Plus besoin de "version:" depuis la spec Compose v2

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22-alpine"
    image: fluvial:latest

    restart: unless-stopped

    ports:
      - target: 3000
        published: 3000
        protocol: tcp

    environment:
      NODE_ENV: production
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"

    env_file:
      - .env

    volumes:
      # admins.json : lecture seule — ne doit jamais être modifié au runtime
      # Le fichier vient de l'image, on le monte en ro pour l'expliciter
      - type: bind
        source: ./data/admins.json
        target: /app/data/admins.json
        read_only: true

      # Données dynamiques dans un dossier dédié — named volumes sur dossiers uniquement
      # instances.json et responses/ sont écrits par l'app à l'intérieur de ce dossier
      - fluvial_data:/app/data

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 1000
        reservations:
          cpus: "0.25"
          memory: 128M

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Filesystem conteneur en lecture seule —
    # seuls les volumes déclarés ci-dessus sont accessibles en écriture
    read_only: true
    tmpfs:
      - /tmp              # Next.js a besoin d'écrire dans /tmp
      - /app/.next/cache  # Cache de rendu Next.js

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    # Protection fork bomb — limite le nombre de processus fils
    pids_limit: 1000

    user: "1001:1001"

    # Logging structure avec rotation pour eviter de saturer le disque
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fluvial_data:
    driver: local